<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ログイン</title>
<link rel="stylesheet" href="/style.css">
<script type="module" src="/browser.js"></script>
<main>
  <h1>ログイン</h1>
  <button id="authenticate" type="button">パスキーでログイン</button>
  <form id="password-form" method="post">
    <label>メールアドレス <input name="email" type="email" autocomplete="username" required></label>
    <label>パスワード <input name="password" type="password" autocomplete="current-password" required></label>
    <button name="action" value="login">ログイン</button>
    <button name="action" value="signup">アカウントを作成</button>
  </form>
  <p id="status" role="status"></p>
</main>
</html>
